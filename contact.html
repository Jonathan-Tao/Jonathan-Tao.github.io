  <style>.ascii-loader {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.7rem;
  background: #dcc8a5;
  color: #2a1d13;
  font-family: "Courier New", monospace;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  animation: loader-failsafe 0s linear 4s forwards;
}

body.site-ready:not(.site-leaving) .ascii-loader {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  /* A pending failsafe animation on opacity/visibility blocks this change in
     Firefox (loader stays up until the 4s failsafe) and skips the fade in
     Chromium, so drop it once the page is ready. */
  animation: none;
}

body.site-leaving .ascii-loader {
  animation: none;
}

.ascii-loader-label {
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.ascii-loader-bar {
  position: relative;
  display: block;
  width: 2rem;
  height: 1.4em;
  color: #d95c16;
  font-size: 1.15rem;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

.ascii-loader-bar::before {
  content: "|";
  animation: ascii-spin 0.55s steps(1, end) infinite;
}

.ascii-loader-bar::after {
  content: none;
}

@keyframes loader-failsafe {
  to {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}

@keyframes ascii-spin {
  0% { content: "|"; }
  25% { content: "/"; }
  50% { content: "—"; }
  75% { content: "\\"; }
}

@media (prefers-reduced-motion: reduce) {
  .ascii-loader-bar::before {
    content: "*";
    animation: none;
  }
}
</style>
